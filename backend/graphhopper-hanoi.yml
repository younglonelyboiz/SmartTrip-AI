graphhopper:
  datareader.file: data/processed/graphhopper/hanoi.osm.pbf
  graph.location: data/processed/graphhopper/hanoi-car-cache
  profiles:
    - name: car
      custom_model_files: [car.json]
  profiles_ch:
    - profile: car
  graph.encoded_values: car_access, car_average_speed
  import.osm.ignored_highways: footway,cycleway,path,pedestrian,steps
  prepare.min_network_size: 200
  prepare.subnetworks.threads: 1
server:
  application_connectors:
    - type: http
      port: 8991
      bind_host: 127.0.0.1
  admin_connectors:
    - type: http
      port: 8992
      bind_host: 127.0.0.1
  request_log:
    appenders: []
logging:
  appenders:
    - type: console
